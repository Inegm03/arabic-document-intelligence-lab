[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-doc-intelligence-lab"
version = "0.1.0"
description = "Reproducible robustness evaluation for Arabic document OCR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.115", "pillow>=10", "python-multipart>=0.0.9", "uvicorn>=0.30"]

[project.scripts]
arabic-doc-lab = "arabic_doc_lab.cli:main"
arabic-doc-fields = "arabic_doc_lab.fields:main"

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
vision = ["google-cloud-vision>=3.10"]
kraken = ["kraken>=7,<8"]
transformers = ["transformers[torch]>=4.57"]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_doc_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
